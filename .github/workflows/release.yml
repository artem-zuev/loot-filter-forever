name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua5.1 lua-check
      - run: luajit tests/run.lua
      - run: lua5.1 tests/run.lua
      - run: luacheck --no-color .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/release.sh "$GITHUB_REF_NAME"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
